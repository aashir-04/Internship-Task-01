<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Layout</title>

<body>

<header>Header</header>

<nav>Navigation Menu</nav>

<main>
    <aside>Content</aside>
    <section>Main Content</section>
    <aside>Content</aside>
</main>

<footer>Footer</footer>


<style>
    body{
        margin:0;
        font-family: Arial, sans-serif;
        background:#f2f2f2;
        display:grid;
        grid-template-rows:auto auto 1fr auto;
        height:100vh;
        gap:10px;
        padding:10px;
        box-sizing:border-box;
    }

    header, nav, footer{
        background:#e6edf2;
        text-align:center;
        padding:20px;
        font-weight:bold;
    }

    main{
        display:grid;
        grid-template-columns:1fr 2fr 1fr;
        gap:10px;
    }

    aside, section{
        background:#e6edf2;
        text-align:center;
        padding:20px;
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:300px;
        font-weight:bold;
    }
</style>
</head>


</body>
</html>
